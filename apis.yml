name: Academic Partnerships
description: 'Academic Partnerships (rebranded as Risepoint in 2024) is an education
  technology and online program management (OPM) company that partners with more than
  100 regional public universities to launch, market, and scale affordable, workforce-focused
  online degree programs. The company provides operational support services including
  digital marketing, student enrollment and retention coaching, faculty support, and
  technology implementation, while curriculum, instruction, and degree conferral remain
  under university control. Its programs concentrate in high-ROI fields such as nursing,
  teaching, business, and public service. This profile was surfaced as an Insight
  Partners portfolio company and added to the API Evangelist network; the company
  publishes no public developer API, developer portal, SDK, or machine-readable API
  surface at this time.'
